name: Package ChatGPT merged Gods Eye

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-merged-build

      - name: Assemble project
        run: bash .github/build_merged_project.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: final/frontend/package-lock.json

      - name: Build frontend
        run: |
          cd final/frontend
          npm ci
          npm run build

      - name: Python syntax checks
        run: python -m compileall -q final/backend final/reconstruction/src final/reconstruction/scripts

      - name: Package ZIP
        run: |
          rm -rf final/frontend/node_modules
          cd final
          zip -r ../Gods_Eye_Final_Merged.zip . >/dev/null
          cd ..
          ls -lh Gods_Eye_Final_Merged.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gods_Eye_Final_Merged
          path: Gods_Eye_Final_Merged.zip
          retention-days: 7
