name: Build merged Gods Eye project

on:
  push:
    branches:
      - chatgpt-merged-build

permissions:
  contents: read

jobs:
  merge-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v4
        with:
          path: ui

      - name: Checkout reconstruction repository
        uses: actions/checkout@v4
        with:
          repository: Vraj-Ramavat/SIH-2026-Gods_Eye
          ref: main
          path: recon

      - name: Assemble final project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final/frontend final/backend final/reconstruction

          # Frontend: keep the React/Vite/Three.js application, but not its duplicate backend.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='backend' \
            --exclude='scratch' \
            --exclude='12306918-hd_1080_1920_60fps.mp4' \
            --exclude='final_SIH_presentation.pptx' \
            ui/ final/frontend/

          # Backend: retain the UI repo's job state model/API contract.
          cp ui/backend/jobs.py final/backend/jobs.py
          touch final/backend/__init__.py

          # Reconstruction engine: this is the single source of truth.
          rsync -a \
            --exclude='.git' \
            --exclude='data' \
            --exclude='notebooks' \
            recon/ final/reconstruction/

          mkdir -p final/storage

          cat > final/backend/pipeline_service.py <<'PY'
          from __future__ import annotations

          import asyncio
          import os
          import sys
          from pathlib import Path
          from typing import Any

          import numpy as np

          from .jobs import get_job, update_job

          ROOT = Path(__file__).resolve().parents[1]
          RECON_ROOT = ROOT / "reconstruction"
          RECON_SRC = RECON_ROOT / "src"
          if str(RECON_SRC) not in sys.path:
              sys.path.insert(0, str(RECON_SRC))


          def _make_flightpath(reconstruction: Any) -> dict[str, list[dict[str, Any]]]:
              from gods_eye.stage3_sfm import get_pose

              waypoints: list[dict[str, Any]] = []
              images = sorted(reconstruction.images.values(), key=lambda im: im.name)
              for image in images:
                  R, _t, center = get_pose(image)
                  forward = R.T @ np.array([0.0, 0.0, 1.0], dtype=float)
                  look = center + forward * 2.0
                  waypoints.append(
                      {
                          "x": round(float(center[0]), 4),
                          "y": round(float(center[1]), 4),
                          "z": round(float(center[2]), 4),
                          "lookAt": {
                              "x": round(float(look[0]), 4),
                              "y": round(float(look[1]), 4),
                              "z": round(float(look[2]), 4),
                          },
                      }
                  )
              return {"waypoints": waypoints}


          async def run_pipeline_job(job_id: str) -> None:
              """Run the canonical SIH-2026-Gods_Eye stages for one uploaded video."""
              job = get_job(job_id)
              if not job or not job.storage_dir or not job.file_path:
                  return

              work = Path(job.storage_dir)
              frames_dir = work / "frames"
              masks_dir = work / "masks"
              sfm_dir = work / "sfm"
              depth_dir = work / "depth"
              fused_dir = work / "fused"
              meshes_dir = work / "meshes"
              output_dir = work / "output"
              for p in (frames_dir, masks_dir, sfm_dir, depth_dir, fused_dir, meshes_dir, output_dir):
                  p.mkdir(parents=True, exist_ok=True)

              fused_cloud = fused_dir / "fused_cloud.ply"
              clean_cloud = fused_dir / "clean_cloud.ply"
              mesh_raw = meshes_dir / "mesh_raw.ply"
              mesh_textured = meshes_dir / "mesh_textured.ply"
              final_glb = output_dir / "output.glb"

              try:
                  from gods_eye.stage1_frames import extract_frames
                  from gods_eye.stage2_masking import mask_dynamic_objects
                  from gods_eye.stage3_sfm import load_reconstruction, run_colmap_sfm
                  from gods_eye.stage4_depth import estimate_depth
                  from gods_eye.stage5_fusion import fuse_depth_with_sfm
                  from gods_eye.stage6_cleanup import clean_point_cloud
                  from gods_eye.stage7_meshing import build_mesh
                  from gods_eye.stage8_texturing import apply_vertex_colors
                  from gods_eye.stage9_export import export_glb

                  update_job(job_id, "extracting_frames", "Extracting and quality-filtering keyframes", 8.0)
                  s1 = await asyncio.to_thread(
                      extract_frames,
                      job.file_path,
                      frames_dir,
                      target_fps=float(os.getenv("GODSEYE_TARGET_FPS", "3")),
                      blur_threshold=float(os.getenv("GODSEYE_BLUR_THRESHOLD", "60")),
                      resize_width=int(os.getenv("GODSEYE_RESIZE_WIDTH", "1920")),
                  )

                  update_job(job_id, "masking_dynamic_objects", "Masking people and vehicles with YOLO", 20.0)
                  s2 = await asyncio.to_thread(
                      mask_dynamic_objects,
                      frames_dir,
                      masks_dir,
                      weights_path=os.getenv("GODSEYE_YOLO_WEIGHTS", "yolo26n.pt"),
                      confidence=float(os.getenv("GODSEYE_YOLO_CONFIDENCE", "0.25")),
                      dynamic_classes=["person", "car", "truck", "bus", "motorcycle", "bicycle"],
                      dilate_px=int(os.getenv("GODSEYE_MASK_DILATE_PX", "10")),
                  )

                  update_job(job_id, "estimating_poses", "COLMAP/PyCOLMAP camera pose reconstruction", 35.0)
                  s3 = await asyncio.to_thread(
                      run_colmap_sfm,
                      frames_dir,
                      sfm_dir,
                      our_masks_dir=masks_dir,
                      matcher=os.getenv("GODSEYE_MATCHER", "sequential"),
                      use_glomap=os.getenv("GODSEYE_USE_GLOMAP", "true").lower() in {"1", "true", "yes"},
                      camera_model=os.getenv("GODSEYE_CAMERA_MODEL", "OPENCV"),
                  )
                  reconstruction_path = Path(s3["model_path"])
                  reconstruction = load_reconstruction(reconstruction_path)
                  flightpath = _make_flightpath(reconstruction)

                  update_job(job_id, "estimating_depth", "Estimating dense depth with Depth Anything V2", 50.0)
                  s4 = await asyncio.to_thread(
                      estimate_depth,
                      frames_dir,
                      depth_dir,
                      model_name=os.getenv(
                          "GODSEYE_DEPTH_MODEL", "depth-anything/Depth-Anything-V2-Small-hf"
                      ),
                      device=os.getenv("GODSEYE_DEVICE", "cuda"),
                  )

                  update_job(job_id, "fusing_depth", "Scale-aligning depth and fusing multi-view geometry", 66.0)
                  s5 = await asyncio.to_thread(
                      fuse_depth_with_sfm,
                      reconstruction_path,
                      frames_dir,
                      depth_dir,
                      fused_cloud,
                      masks_dir=masks_dir,
                      pixel_stride=int(os.getenv("GODSEYE_PIXEL_STRIDE", "4")),
                      ransac_residual_threshold=float(os.getenv("GODSEYE_RANSAC_THRESHOLD", "0.5")),
                  )

                  update_job(job_id, "cleaning", "Cleaning fused point cloud", 76.0)
                  s6 = await asyncio.to_thread(
                      clean_point_cloud,
                      fused_cloud,
                      clean_cloud,
                      nb_neighbors=int(os.getenv("GODSEYE_NB_NEIGHBORS", "20")),
                      std_ratio=float(os.getenv("GODSEYE_STD_RATIO", "2.0")),
                      voxel_size=float(os.getenv("GODSEYE_VOXEL_SIZE", "0.05")),
                  )

                  update_job(job_id, "meshing", "Reconstructing Poisson surface mesh", 84.0)
                  s7 = await asyncio.to_thread(
                      build_mesh,
                      clean_cloud,
                      mesh_raw,
                      method=os.getenv("GODSEYE_MESH_METHOD", "poisson"),
                      poisson_depth=int(os.getenv("GODSEYE_POISSON_DEPTH", "9")),
                      density_trim_quantile=float(os.getenv("GODSEYE_DENSITY_TRIM", "0.02")),
                  )

                  update_job(job_id, "texturing", "Projecting source-video colour onto mesh", 91.0)
                  s8 = await asyncio.to_thread(apply_vertex_colors, mesh_raw, clean_cloud, mesh_textured)

                  update_job(job_id, "exporting", "Optimizing and exporting browser-ready GLB", 97.0)
                  s9 = await asyncio.to_thread(
                      export_glb,
                      mesh_textured,
                      final_glb,
                      target_triangle_count=int(os.getenv("GODSEYE_TARGET_TRIANGLES", "150000")),
                  )

                  coverage = 0.0
                  if s3.get("num_input_images"):
                      coverage = 100.0 * s3.get("num_registered_images", 0) / s3["num_input_images"]

                  metadata = {
                      "job_id": job_id,
                      "vertex_count": int(s7.get("num_vertices", 0)),
                      "face_count": int(s9.get("triangles_after", s7.get("num_triangles", 0))),
                      "point_count": int(s6.get("points_after", s5.get("num_points_final", 0))),
                      "texture_resolution": "Vertex colours from source video",
                      "file_size_mb": s9.get("file_size_mb"),
                      "processing_time_seconds": get_job(job_id).processing_time_seconds if get_job(job_id) else 0,
                      "coverage_percent": round(coverage, 2),
                      "reconstruction_method": "COLMAP/PyCOLMAP + YOLO masking + Depth Anything V2 + robust depth/SfM fusion + Open3D Poisson mesh",
                      "registered_frames": int(s3.get("num_registered_images", 0)),
                      "input_frames": int(s3.get("num_input_images", 0)),
                      "reprojection_error": s3.get("mean_reprojection_error"),
                      "metric_scale_note": "Absolute real-world scale requires GPS/telemetry, a known metric reference, or a metric-depth prior.",
                      "capture_metadata": {
                          "location": "Not provided",
                          "capture_date": "Not provided",
                          "altitude_agl_m": None,
                          "gps_coordinates": None,
                      },
                      "stage_stats": {
                          "frame_extraction": s1,
                          "masking": s2,
                          "sfm": s3,
                          "depth": s4,
                          "fusion": {k: v for k, v in s5.items() if k != "per_frame"},
                          "cleanup": s6,
                          "meshing": s7,
                          "texturing": s8,
                          "export": s9,
                      },
                  }

                  update_job(
                      job_id,
                      "complete",
                      "Reconstruction complete",
                      100.0,
                      metadata=metadata,
                      flightpath=flightpath,
                      fallback_stages=[],
                  )
              except Exception as exc:
                  update_job(
                      job_id,
                      "failed",
                      "Pipeline failed",
                      0.0,
                      error=f"{type(exc).__name__}: {exc}",
                  )
          PY

          cat > final/backend/main.py <<'PY'
          from __future__ import annotations

          import os
          import uuid
          from pathlib import Path

          from fastapi import BackgroundTasks, FastAPI, File, HTTPException, UploadFile, status
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.responses import FileResponse

          from .jobs import JOBS_DB, create_job, get_job
          from .pipeline_service import run_pipeline_job

          ROOT = Path(__file__).resolve().parents[1]
          STORAGE_ROOT = Path(os.getenv("GODSEYE_STORAGE_ROOT", ROOT / "storage"))
          STORAGE_ROOT.mkdir(parents=True, exist_ok=True)

          MAX_FILE_SIZE_BYTES = int(os.getenv("GODSEYE_MAX_UPLOAD_MB", "500")) * 1024 * 1024
          ALLOWED_EXTENSIONS = {".mp4", ".avi", ".mov", ".mkv", ".webm"}

          app = FastAPI(
              title="God's Eye Unified API",
              description="Single-pass drone-video to 3D reconstruction using the canonical SIH-2026-Gods_Eye pipeline.",
              version="2.0.0",
          )

          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )


          @app.get("/api/health")
          def health_check():
              return {
                  "status": "online",
                  "service": "God's Eye Unified Backend",
                  "problem_statement": "SIH26158",
                  "pipeline": "SIH-2026-Gods_Eye canonical stages 1-9",
                  "active_jobs_count": len(JOBS_DB),
              }


          @app.post("/api/jobs", status_code=status.HTTP_202_ACCEPTED)
          async def create_reconstruction_job(
              background_tasks: BackgroundTasks,
              file: UploadFile = File(...),
          ):
              filename = file.filename or "video.mp4"
              ext = Path(filename).suffix.lower()
              if ext not in ALLOWED_EXTENSIONS:
                  raise HTTPException(400, f"Unsupported video type '{ext}'.")

              job_id = str(uuid.uuid4())
              job_dir = STORAGE_ROOT / job_id
              job_dir.mkdir(parents=True, exist_ok=True)
              input_path = job_dir / f"input{ext}"

              total_bytes = 0
              try:
                  with input_path.open("wb") as out:
                      while True:
                          chunk = await file.read(1024 * 1024)
                          if not chunk:
                              break
                          total_bytes += len(chunk)
                          if total_bytes > MAX_FILE_SIZE_BYTES:
                              raise HTTPException(413, "Video exceeds the configured upload limit.")
                          out.write(chunk)
              except Exception:
                  if input_path.exists():
                      input_path.unlink()
                  raise
              finally:
                  await file.close()

              job = create_job(job_id, str(input_path), str(job_dir))
              background_tasks.add_task(run_pipeline_job, job_id)
              return {
                  "job_id": job.job_id,
                  "status": job.status,
                  "stage": job.stage,
                  "message": "Upload accepted; reconstruction started.",
              }


          @app.get("/api/jobs/{job_id}")
          def get_job_status(job_id: str):
              job = get_job(job_id)
              if not job:
                  raise HTTPException(404, "Job not found.")
              data = {
                  "job_id": job.job_id,
                  "status": job.status,
                  "stage": job.stage,
                  "progress": job.progress,
                  "processing_time_seconds": job.processing_time_seconds,
                  "fallback_stages": job.fallback_stages,
                  "used_fallback": job.used_fallback,
                  "error": job.error,
              }
              if job.status == "complete":
                  data["metadata"] = job.metadata
                  data["flightpath_available"] = bool(job.flightpath)
              return data


          @app.get("/api/jobs/{job_id}/model.glb")
          def get_model(job_id: str):
              job = get_job(job_id)
              if not job or not job.storage_dir:
                  raise HTTPException(404, "Job not found.")
              model = Path(job.storage_dir) / "output" / "output.glb"
              if not model.exists():
                  raise HTTPException(404, "Model is not ready yet.")
              return FileResponse(model, media_type="model/gltf-binary", filename=f"godseye_{job_id[:8]}.glb")


          @app.get("/api/jobs/{job_id}/metadata")
          def get_metadata(job_id: str):
              job = get_job(job_id)
              if not job:
                  raise HTTPException(404, "Job not found.")
              if not job.metadata:
                  raise HTTPException(409, "Metadata is not ready yet.")
              return job.metadata


          @app.get("/api/jobs/{job_id}/flightpath")
          def get_flightpath(job_id: str):
              job = get_job(job_id)
              if not job:
                  raise HTTPException(404, "Job not found.")
              if not job.flightpath:
                  raise HTTPException(409, "Flight path is not ready yet.")
              return job.flightpath
          PY

          cat > final/backend/requirements.txt <<'REQ'
          -r ../reconstruction/requirements.txt
          REQ

          cat > final/requirements.txt <<'REQ'
          -r reconstruction/requirements.txt
          REQ

          cat > final/.gitignore <<'EOF'
          .venv/
          __pycache__/
          *.pyc
          storage/*
          !storage/.gitkeep
          frontend/node_modules/
          frontend/dist/
          .env
          EOF
          touch final/storage/.gitkeep

          cat > final/README.md <<'MD'
          # God's Eye — Unified SIH 2026 Project

          This package merges the two original repositories into one clean application:

          - **Frontend:** React + Vite + React Three Fiber/WebGL from `God-s_Eye_UI-UX`.
          - **Backend/API:** the upload/job/status/model API contract from the UI repository.
          - **Reconstruction:** the canonical nine-stage pipeline from `SIH-2026-Gods_Eye`.

          The duplicate reconstruction implementation previously present under `God-s_Eye_UI-UX/backend/pipeline` is intentionally **not included**. There is now only one reconstruction engine.

          ## Architecture

          `Drone video -> frame quality filtering -> YOLO dynamic masks -> COLMAP/PyCOLMAP SfM -> Depth Anything V2 -> depth/SfM fusion -> point-cloud cleanup -> Poisson mesh -> vertex colour -> GLB -> FastAPI -> React Three Fiber`

          ## 1. System requirements

          - Python 3.10 or 3.11 recommended
          - Node.js 20+ (Node 22 recommended)
          - COLMAP installed and on `PATH`; GLOMAP is optional
          - NVIDIA CUDA GPU recommended for YOLO and depth estimation; CPU fallback is supported but slow

          ## 2. Backend setup

          From the project root:

          ```bash
          python -m venv .venv
          # Windows PowerShell: .\.venv\Scripts\Activate.ps1
          # Linux/macOS: source .venv/bin/activate
          pip install -r requirements.txt
          uvicorn backend.main:app --reload --port 8000
          ```

          API health check: `http://localhost:8000/api/health`

          ## 3. Frontend setup

          In another terminal:

          ```bash
          cd frontend
          npm install
          npm run dev
          ```

          Open the Vite URL (normally `http://localhost:5173`). The frontend defaults to the backend at `http://localhost:8000` and can be changed with `VITE_BACKEND_URL`.

          ## 4. Production frontend build

          A verified production build is already included in `frontend/dist` in this ZIP. To rebuild:

          ```bash
          cd frontend
          npm ci
          npm run build
          ```

          ## Important reconstruction note

          The SfM + relative-depth fusion produces a geometrically consistent reconstruction, but **absolute real-world metric scale is not guaranteed from monocular RGB video alone**. For absolute scale/georeferencing, add GPS/telemetry, a known metric reference, or a metric-depth prior.

          ## Useful environment variables

          - `GODSEYE_DEVICE=cuda|cpu`
          - `GODSEYE_MATCHER=sequential|exhaustive`
          - `GODSEYE_USE_GLOMAP=true|false`
          - `GODSEYE_YOLO_WEIGHTS=yolo26n.pt`
          - `GODSEYE_DEPTH_MODEL=depth-anything/Depth-Anything-V2-Small-hf`
          - `GODSEYE_MAX_UPLOAD_MB=500`
          - `GODSEYE_TARGET_FPS=3`
          - `GODSEYE_TARGET_TRIANGLES=150000`

          ## Merge decision

          The UI, dashboard, upload flow, measurement tools and 3D viewer come from the UI/UX repository. All reconstruction stages come from the SIH reconstruction repository. This removes the earlier conflicts in frame naming, mask convention, COLMAP mask handling, depth representation and fusion logic.
          MD

          cat > final/MERGE_NOTES.md <<'MD'
          # Merge notes

          ## Kept from God-s_Eye_UI-UX
          - React/Vite frontend
          - React Three Fiber / Three.js viewer
          - upload UI, telemetry UI, measurement/flythrough controls
          - job state model (`backend/jobs.py`)
          - REST API contract (`/api/jobs`, status, model, metadata, flightpath)
          - demo GLB assets

          ## Replaced
          The old `backend/pipeline/*` reconstruction modules were removed from the final package. They duplicated the main project and differed in mask semantics, frame naming, COLMAP integration, depth normalization and scale fusion.

          ## Canonical engine
          `reconstruction/src/gods_eye/stage1_frames.py` through `stage9_export.py` are now the only reconstruction implementation used by the backend.
          MD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: final/frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd final/frontend
          npm ci
          npm run build

      - name: Python syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q final/backend final/reconstruction/src final/reconstruction/scripts

      - name: Package merged project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final/frontend/node_modules
          cd final
          zip -r ../Gods_Eye_Final_Merged.zip . >/dev/null
          cd ..
          ls -lh Gods_Eye_Final_Merged.zip

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gods_Eye_Final_Merged
          path: Gods_Eye_Final_Merged.zip
          if-no-files-found: error
          retention-days: 7
